name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run compile

      - run: npm run lint

      # Extension tests spin up a real VS Code instance, which needs a display.
      # ubuntu-latest has none by default, so run under a virtual framebuffer.
      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test

      - name: Test (Windows/macOS)
        if: runner.os != 'Linux'
        run: npm test
